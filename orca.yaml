# Orca ADE 项目配置
# https://orca.ai/docs

repo:
  # 默认基准分支 - 所有新工作树都基于此分支
  defaultBaseRef: origin/main

  # 项目 setup 配置
  setup:
    # 安装依赖命令
    installCommand: npm install
    # 安装后钩子
    postInstall: []
    # 是否每次新建工作树都重新运行 setup
    # false = 继承，利用已有安装
    setupNewWorktrees: inherit

  # 默认终端配置 - 新建工作树自动打开这些终端
  defaultTerminals:
    - title: Claude Dev
      command: claude
      split: none  # 第一个终端占满整个面板

# 项目级环境变量（可选）
env: {}
